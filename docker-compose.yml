services:
  app:
    build: .
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - dados:/app/storage

  api:
    build: .
    env_file: .env
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - dados:/app/storage

  followup:
    build: .
    env_file: .env
    command: python -m src.services.followup --loop 300
    volumes:
      - dados:/app/storage
    restart: unless-stopped

volumes:
  dados:
